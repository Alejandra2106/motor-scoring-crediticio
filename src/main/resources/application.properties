spring.application.name=motor-scoring-crediticio
spring.datasource.url=jdbc:${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT RS256 emitido por auth-api (HU10). Solo la clave pública X.509, en un archivo externo
# (p. ej. file:/ruta/jwt-publica.pem); nunca se versiona. El emisor debe coincidir con el de auth-api.
# Ambas variables son obligatorias: sin ellas la aplicación no arranca.
scoring.jwt.emisor=${AUTH_JWT_ISSUER}
scoring.jwt.audiencia=scoring-api
scoring.jwt.clave-publica=${SCORING_JWT_PUBLIC_KEY_LOCATION}

# Swagger deshabilitado por defecto; se habilita con el perfil "dev".
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
