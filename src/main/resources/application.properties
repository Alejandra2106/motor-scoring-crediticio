spring.application.name=motor-scoring-crediticio
spring.datasource.url=jdbc:${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT RS256 emitido por auth-api (HU10). Solo la clave pública X.509, en un archivo externo
# (p. ej. file:/ruta/jwt-publica.pem); nunca se versiona. El emisor debe coincidir con el de auth-api.
# Ambas variables son obligatorias: sin ellas la aplicación no arranca.
scoring.jwt.emisor=${AUTH_JWT_ISSUER}
scoring.jwt.audiencia=scoring-api
scoring.jwt.clave-publica=${SCORING_JWT_PUBLIC_KEY_LOCATION}

# Swagger deshabilitado por defecto; se habilita con el perfil "dev".
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Saga de recomendaciones (HU14). Deshabilitada por defecto: habilitarla solo con evaluation-query-api
# desplegada, la identidad de servicio configurada y el catálogo de recomendaciones APROBADO. Sin ella, las
# evaluaciones nuevas quedan PENDIENTE. Valores aprobados el 2026-10-18.
scoring.saga.habilitada=${SCORING_SAGA_HABILITADA:false}
scoring.saga.url-base=${EVALUATION_QUERY_API_BASE_URL:}
scoring.saga.max-intentos=10
scoring.saga.espera-inicial=5s
scoring.saga.espera-maxima=300s
scoring.saga.variacion=0.2
scoring.saga.concesion=30s
scoring.saga.conexion-en-linea=1s
scoring.saga.limite-en-linea=2s
scoring.saga.conexion-reenvio=2s
scoring.saga.limite-reenvio=10s
scoring.saga.trabajos-por-ciclo=20
scoring.saga.frecuencia-reenvio=PT5S

# Token de servicio hacia evaluation-query-api (identidad S1). Par RS256 propio de scoring-api, en archivos
# PEM externos que nunca se versionan; la clave pública se entrega a evaluation-query-api.
scoring.servicio-jwt.emisor=${SCORING_SERVICE_JWT_ISSUER:scoring-api}
scoring.servicio-jwt.sujeto=scoring-api
scoring.servicio-jwt.audiencia=evaluation-query-api-internal
scoring.servicio-jwt.permiso=recomendaciones:generar
scoring.servicio-jwt.tipo=scoring-svc+jwt
scoring.servicio-jwt.duracion=60s
scoring.servicio-jwt.id-clave=${SCORING_SERVICE_JWT_KEY_ID:}
scoring.servicio-jwt.clave-privada=${SCORING_SERVICE_JWT_PRIVATE_KEY_LOCATION:}
scoring.servicio-jwt.clave-publica=${SCORING_SERVICE_JWT_PUBLIC_KEY_LOCATION:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
