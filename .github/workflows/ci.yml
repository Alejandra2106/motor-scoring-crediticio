name: Calidad y artefacto

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-acceptance-and-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar unitarias y aceptacion Karate; generar JAR y cobertura
        run: ./mvnw -B clean verify -DskipITs

      - name: Publicar artefacto ejecutable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-scoring-jar
          path: target/motor-scoring-crediticio-*.jar
          if-no-files-found: warn

      - name: Publicar evidencias de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-calidad
          path: |
            target/surefire-reports/
            target/karate-reports/
            target/site/jacoco/
          if-no-files-found: warn

      - name: Verificar configuracion de SonarCloud
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [[ -n "$SONAR_TOKEN" && -n "$SONAR_PROJECT_KEY" && -n "$SONAR_ORGANIZATION" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SonarCloud pendiente: configurar SONAR_TOKEN, SONAR_PROJECT_KEY y SONAR_ORGANIZATION."
          fi

      - name: Analizar codigo en SonarCloud
        if: steps.sonar-config.outputs.ready == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: >-
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true

  integration-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scoring_test
          POSTGRES_USER: scoring
          POSTGRES_PASSWORD: scoring_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoring -d scoring_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql://localhost:5432/scoring_test
      DB_USERNAME: scoring
      DB_PASSWORD: scoring_test_password
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar suite completa con PostgreSQL
        run: ./mvnw -B clean verify

      - name: Publicar resultados de integracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-integracion-postgresql
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
